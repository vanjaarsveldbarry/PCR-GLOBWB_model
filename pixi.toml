[workspace]
name = "pcrglobwb"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "=3.10.13"
numpy = "=1.26.4"
netCDF4 = "=1.6.4"
python-dateutil = "*"
six = "*"
pcraster = ">=4.4.2,<5"
rsync = ">=3.4.2,<4"

[feature.tools.dependencies]
cdo = "*"
nco = "*"

[environments]
default = { features = [] }
tools = { features = ["tools"], no-default-feature = true }
