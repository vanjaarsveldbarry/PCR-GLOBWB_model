[workspace]
authors = ["vanjaarsveldbarry <a.s.vanjaarsveld@uu.nl>"]
channels = ["conda-forge", "bioconda"]
name = "pcrglobwb_python3"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.10"
numpy = "*"
pip = "*"
python-dateutil = "*"
six = "*"
zlib = "*"
pcraster = ">=4.4.0"
cdo = "*"
nco = "*"
ncview = "*"
zarr = ">=3.2.1,<4"
xarray = ">=2026.7.0,<2027"
# required by virtualOS.readUpstreamDischarge, which opens the upstream
# discharge netCDF with chunks='auto'
dask = "*"
libnetcdf = ">=4.10.1,<5"
nextflow = ">=25.04"

[pypi-dependencies]
netcdf4 = ">=1.5.3"
